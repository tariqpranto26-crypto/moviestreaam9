<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"><meta name="theme-color" content="#15171c"><meta name="color-scheme" content="dark"><title>My Watchlist | MovieStream</title><link rel="stylesheet" href="css/styles.css"></head><body>
<main id="main-content"><div class="container"><p style="margin-top:24px"><a class="link-more" href="index.html">&larr; Back</a></p><div style="display:flex;justify-content:space-between;align-items:center"><h1 class="page-h1">My Watchlist</h1><button class="btn btn-secondary btn-sm" id="clear">Clear</button></div><div class="grid" id="g"></div><div id="e"></div></div></main>
