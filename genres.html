<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"><meta name="theme-color" content="#15171c"><meta name="color-scheme" content="dark"><title>Genres | MovieStream</title><link rel="stylesheet" href="css/styles.css"></head><body>
<main id="main-content"><div class="container"><h1 class="page-h1">Genres</h1>
<nav class="sort-tabs" aria-label="Sort"><a data-sort="popular">Popular</a><a data-sort="newest">Newest</a><a data-sort="oldest">Oldest</a><a data-sort="rating">Top rated</a></nav>
<div class="chip-row" id="chips" role="group" aria-label="All genres"></div>
<div class="grid" id="grid"></div><nav class="pager" id="pager" aria-label="Pagination"></nav></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>mountChrome("");
const qs=new URLSearchParams(location.search);const q=(qs.get("q")||"").toLowerCase();
const all=[...new Set([...GENRES_MOVIE,...GENRES_TV])];
document.getElementById("chips").innerHTML=["All",...all].map(g=>`<a class="chip" data-genre="${g}">${g}</a>`).join("");
runListing({filter:t=>!q||t.title.toLowerCase().includes(q)||t.genres.join(" ").toLowerCase().includes(q)});
if(q)document.querySelector("h1").textContent=`Results for \u201c${qs.get("q")}\u201d`;</script></body></html>
