<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"><meta name="theme-color" content="#15171c"><meta name="color-scheme" content="dark"><title>Collections | MovieStream</title><link rel="stylesheet" href="css/styles.css"></head><body>
<main id="main-content"><div class="container"><p style="margin-top:24px"><a class="link-more" href="index.html">&larr; Back</a></p><h1 class="page-h1">Collections</h1><div class="coll-grid" id="g"></div></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>mountChrome("");document.getElementById("g").innerHTML=[...COLLECTIONS,...COLLECTIONS.slice(0,10).map((c,i)=>({...c,id:100+i,name:c.name+" II"}))].slice(0,22).map(c=>{const art=CATALOG[(c.id*7)%CATALOG.length];return `<a class="coll-tile" href="collection.html?id=${c.id}"><img src="${backdrop(art,780)}" alt="${c.name} artwork" loading="lazy"><span class="cap"><b>${c.name}</b><span>${c.count} films</span></span></a>`;}).join("");</script></body></html>
