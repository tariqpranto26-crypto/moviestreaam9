<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"><meta name="theme-color" content="#15171c"><meta name="color-scheme" content="dark"><title>Collection | MovieStream</title><link rel="stylesheet" href="css/styles.css"></head><body>
<main id="main-content"><div class="container" id="w"></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>mountChrome("");
const c=COLLECTIONS[(Number(new URLSearchParams(location.search).get("id")||1)-1)%COLLECTIONS.length];
document.title=`${c.name} | MovieStream`;
const parts=[...CATALOG].sort((a,b)=>a.year-b.year).slice(0,8);
document.getElementById("w").innerHTML=`<p style="margin-top:24px"><a class="link-more" href="collections.html">&larr; Back</a></p>
<div class="person"><img src="${poster(CATALOG[(c.id*7)%CATALOG.length])}" alt="${c.name} artwork"><div><p class="share-strip">Movie collection</p><h1 class="page-h1" style="margin-top:0">${c.name}</h1><p class="lead">${c.count} films</p><p class="syn">${c.desc}</p></div></div>
<section class="block"><div class="rail-head"><div><h2>Collection parts</h2></div></div><div class="grid">${parts.map(x=>cardHTML(x)).join("")}</div></section>`;</script></body></html>
